name: ${COMPOSE_PROJECT_NAME:-windows-ad-zabbix}

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: database
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ZABBIX_SERVER_PORT:-10051}:10051"
    depends_on:
      database:
        condition: service_healthy
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logs

  web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: server
      DB_SERVER_HOST: database
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PHP_TZ: ${PHP_TZ:-Europe/Berlin}
    ports:
      - "127.0.0.1:${ZABBIX_WEB_PORT:-8081}:8080"
    depends_on:
      database:
        condition: service_healthy
      server:
        condition: service_started
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logs

volumes:
  postgres_data:

networks:
  backend:

