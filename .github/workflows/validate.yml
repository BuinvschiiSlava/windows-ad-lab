name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Recurse -Include *.ps1,*.psd1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Validate example configuration
        shell: pwsh
        run: |
          $configuration = Import-PowerShellDataFile ./config/lab.example.psd1
          if ($configuration.DomainName -ne 'corp.lab') { throw 'Unexpected example domain.' }

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Zabbix Compose model
        working-directory: zabbix
        run: |
          cp .env.example .env
          docker compose --env-file .env config --quiet

